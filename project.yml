name: ParkAlong
options:
  bundleIdPrefix: com.sidkrishnan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  ParkAlong:
    type: application
    platform: iOS
    sources:
      - path: ParkAlong
        excludes:
          - Resources
      - path: ParkAlong/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidkrishnan.ParkAlong
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        PARKALONG_REMOTE_BASE_URL: ""
        INFOPLIST_KEY_ParkAlongRemoteBaseURL: "$(PARKALONG_REMOTE_BASE_URL)"
        INFOPLIST_KEY_CFBundleDisplayName: ParkAlong
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Your location helps find parking near you. You can keep using destination search without it.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - ParkAlongTests
        - ParkAlongUITests
  ParkAlongTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParkAlongTests
    dependencies:
      - target: ParkAlong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidkrishnan.ParkAlongTests
        GENERATE_INFOPLIST_FILE: YES
  ParkAlongUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ParkAlongUITests
    dependencies:
      - target: ParkAlong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidkrishnan.ParkAlongUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ParkAlong
