name: ParkAlong
options:
  bundleIdPrefix: com.sidkrishnan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  ParkAlong:
    type: application
    platform: iOS
    sources:
      - path: ParkAlong
        excludes:
          - Resources
          - Info.plist
      - path: ParkAlong/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidkrishnan.ParkAlong
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ParkAlong/Info.plist
        PARKALONG_REMOTE_BASE_URL: ""
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: ParkAlongLiveActivity
        embed: true
    scheme:
      testTargets:
        - ParkAlongTests
        - ParkAlongUITests
  ParkAlongLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: ParkAlongLiveActivity
        excludes:
          - Info.plist
      - path: ParkAlong/LiveActivityShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidkrishnan.ParkAlong.LiveActivity
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ParkAlongLiveActivity/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
  ParkAlongTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParkAlongTests
    dependencies:
      - target: ParkAlong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidkrishnan.ParkAlongTests
        GENERATE_INFOPLIST_FILE: YES
  ParkAlongUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ParkAlongUITests
    dependencies:
      - target: ParkAlong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidkrishnan.ParkAlongUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ParkAlong
